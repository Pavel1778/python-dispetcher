# Render Blueprint for the OpenHands dispatcher.
# Free plan notes:
#   * Free web services spin down after inactivity and restart on request.
#   * The dispatcher therefore rebuilds state from PostgreSQL on every start.
#   * A free instance is NOT a guarantee of 24/7 background processing.
services:
  - type: web
    name: openhands-dispatcher
    runtime: python
    plan: free
    region: oregon
    # The code lives on this branch; ``main`` only holds the initial LICENSE.
    branch: python-dispetcher
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: OPENHANDS_CLOUD_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: DATABASE_TRANSACTION_POOLER
        value: "true"
      - key: JR_BRIDGE_TOKEN
        sync: false
      - key: JR_SCOPE_SECRET
        sync: false
      - key: JR_ALLOWED_REPOSITORIES
        sync: false
      - key: MCP_ENABLED
        value: "true"
      - key: MCP_PUBLIC_BASE_URL
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: HEARTBEAT_URL
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_COOKIE_SECURE
        value: "true"
      - key: DISPATCHER_ENABLE_BACKGROUND_LOOP
        value: "true"
      - key: DISPATCHER_POLL_INTERVAL_SECONDS
        value: "15"
      - key: LOG_LEVEL
        value: "INFO"
