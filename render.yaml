# Render blueprint for the Sr/Jr dispatcher web control plane.
#
# The service is a single stdlib HTTP server run as a module; there is no
# WSGI/ASGI object and no external process manager. It is stateful: it holds a
# background loop that drives Sr tool calls, Jr dispatch and workflow
# verification, so run exactly one instance.
#
# The same process advances autonomous runs (the studio's "Автономно" mode), on
# a thread of its own. Nothing has to be set for that. NEXUS_LAB_INLINE=0 turns
# it off, for a deployment where `python -m orchestration.lab_worker` runs as a
# service of its own.
#
# The schema is applied by the process on first start (idempotent, recorded in
# ``schema_migrations``), because the free plan has no shell to run ``psql`` in.
# Set ``AUTO_MIGRATE=false`` if migrations are applied by a release step instead.
#
# Free plan caveats:
#   * The instance spins down after ~15 minutes idle and cold-starts on the
#     next request, so the background loops are not continuously running: an
#     autonomous run starts no new task while the instance sleeps. For a run
#     that has to work unattended use a paid plan, or have something outside
#     request /healthz every few minutes.
#   * There is no shell and no persistent disk; all state lives in PostgreSQL.
#
# Before the first deploy, generate the two secrets once (see DEPLOY.md):
#   AUTH_PASSWORD_HASH   from `python -m orchestration.web_auth hash`
#   AUTH_SESSION_SECRET  from `python -m orchestration.web_auth secret`
# The hash contains '$' separators. A shell expands or removes them inside double
# quotes, a heredoc and an unquoted assignment, which corrupts the value. Paste it
# into the Render dashboard verbatim, and quote it in single quotes in a shell:
#   export AUTH_PASSWORD_HASH='pbkdf2_sha256$<iterations>$<salt>$<digest>'
# Verify the value that is actually set before deploying:
#   python -m orchestration.web_auth check
services:
  - type: web
    name: python-dispetcher
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m orchestration.web_server --host 0.0.0.0 --port $PORT --token $WEB_AUTH_TOKEN
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Required. PostgreSQL/Supabase DSN. Set in the dashboard, never here.
      # The transaction pooler URI (port 6543) is fine: server-side prepared
      # statements are off by default, so the pooler cannot hand a session with
      # a stale prepared statement to the next start.
      - key: SUPABASE_DB_URL
        sync: false
      # Optional. Server-side prepared statements are disabled by default; set
      # this to "session" only for a direct (session-mode) connection, where
      # preparation is safe and faster. Do not set it behind a pooler.
      - key: PSYCOPG_PREPARE
        sync: false
      # Apply the idempotent migrations on start. The free plan has no shell, so
      # this is the only way to create the schema; set false to manage it
      # out of band.
      - key: AUTO_MIGRATE
        value: "true"
      # Required. OpenHands Cloud API key (Bearer). Set in the dashboard.
      - key: OPENHANDS_API_KEY
        sync: false
      # Required. Owner login. The server refuses to bind 0.0.0.0 without these
      # three, so a public deploy always has a way to authenticate a human.
      - key: AUTH_USERNAME
        sync: false
      # Required. PBKDF2 hash of the owner password. Never the password itself.
      - key: AUTH_PASSWORD_HASH
        sync: false
      # Required. Separate secret that signs sessions. Not the API key.
      - key: AUTH_SESSION_SECRET
        sync: false
      # Required. Bearer token that guards the machine API and the public bind.
      # Distinct from the login; a machine client sends it instead of a session.
      - key: WEB_AUTH_TOKEN
        sync: false
      # Optional. GitHub token used to discover the account's repositories so
      # the allowlist can fill itself in ("Загрузить из GitHub"). Needs only
      # read access to repositories; never returned by the API or the UI.
      # Set it in the dashboard. Leave unset to add repositories by hand.
      - key: GITHUB_TOKEN
        sync: false
      # Optional. Override only for a self-hosted Cloud/Enterprise instance.
      - key: OPENHANDS_CLOUD_URL
        sync: false
      # Optional. Select an account agent profile by id. Unset = inherit the
      # account's own active profile and its configured MCP servers/skills.
      - key: OPENHANDS_AGENT_PROFILE_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"

  # The autonomous lab worker: a background worker service that advances runs.
  # The web service above advances them too (its own loop is on unless
  # NEXUS_LAB_INLINE=0), so this service is what keeps runs moving while the
  # web service sleeps; the two may run together. It shares the same database
  # and environment as the web service, so the two agree on configuration. It
  # serves no HTTP, so it is a "worker" service, not a "web" one.
  - type: worker
    name: python-dispetcher-lab-worker
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m orchestration.lab_worker --worker-id render-lab-1
    autoDeploy: true
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: OPENHANDS_API_KEY
        sync: false
      - key: OPENHANDS_TRANSPORT
        sync: false
      - key: OPENHANDS_DEFAULT_MODEL
        sync: false
      - key: NEXUS_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
