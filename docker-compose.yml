# NEXUS — local, reproducible stack (PostgreSQL + the single NEXUS instance).
#
# Not a production topology: this runs one app instance and one database on your
# machine so the MVP can be started from a clean environment with one command.
# The app is stateful (it runs the dispatch loop), so never scale it past one
# replica.
#
#   cp .env.example .env       # then fill in the values (see README)
#   docker compose up --build
#   open http://localhost:8000
#
# Docker Compose interpolates '$' in the env_file, so a value that contains one
# (AUTH_PASSWORD_HASH does) must be doubled: '$$'. With the hash from
# `python -m orchestration.web_auth hash`, replace each '$' with '$$'.
#
# The database is disposable: `docker compose down -v` removes its volume.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    # Not published to the host: the app reaches the database on the compose
    # network. Publishing 5432 would collide with a local PostgreSQL.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nexus-db:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides the DSN so the app talks to the compose database.
      SUPABASE_DB_URL: postgresql://nexus:nexus@db:5432/nexus
      AUTO_MIGRATE: "true"
      HOST: 0.0.0.0
      PORT: "8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    # The image CMD starts the server; it reads WEB_AUTH_TOKEN and
    # AUTH_PASSWORD_HASH from the environment (env_file). Migrations are applied
    # by the process on first connect (idempotent).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The autonomous lab worker: a separate process that advances runs. It is not
  # a thread of the app, so a run continues when no browser is connected and
  # when the web process restarts. It talks to the same PostgreSQL, so it needs
  # no port of its own. Run one worker per deployment (or several: claims are
  # leases, so extra workers only take more work). The app advances runs too,
  # on a thread of its own, unless NEXUS_LAB_INLINE=0 is set for it.
  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_DB_URL: postgresql://nexus:nexus@db:5432/nexus
      AUTO_MIGRATE: "true"
    env_file:
      - .env
    command: ["python", "-m", "orchestration.lab_worker", "--worker-id", "compose-lab-1"]
    restart: unless-stopped

volumes:
  nexus-db:
