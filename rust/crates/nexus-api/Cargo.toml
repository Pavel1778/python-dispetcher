[package]
name = "nexus-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NEXUS HTTP API in Rust (Axum): the read routes and health probes, at parity with the Python server's JSON."

[dependencies]
nexus-store = { path = "../nexus-store" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
tower = "0.5"
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
