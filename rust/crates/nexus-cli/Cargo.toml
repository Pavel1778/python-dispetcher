[package]
name = "nexus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The NEXUS CLI, migrated to Rust: domain and scheduler decisions, and a parity oracle."

[[bin]]
name = "nexus-rs"
path = "src/main.rs"

[dependencies]
nexus-domain = { path = "../nexus-domain" }
nexus-core = { path = "../nexus-core" }
nexus-store = { path = "../nexus-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json"] }
