[workspace]
resolver = "2"
members = [
    "crates/nexus-domain",
    "crates/nexus-core",
    "crates/nexus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
