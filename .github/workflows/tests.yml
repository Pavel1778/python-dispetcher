name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # TEMPORARY (diagnosis): the same job on both images that `ubuntu-latest`
    # currently resolves to, to see which one the dependency step fails on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}

    # The Cloud integration tests run against a real PostgreSQL server and skip
    # cleanly when it is absent, so the service is only here to keep them
    # running. No repository secret is needed: the DSN below is a throwaway
    # local credential. The tests apply migrations/ themselves.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oh_test
          POSTGRES_PASSWORD: oh_test_pw
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_SUPABASE_DB_URL: postgresql://oh_test:oh_test_pw@127.0.0.1:5432/orchestrator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12.x, not the exact patch. The runner image no longer ships
          # 3.12.6 (it reported "The version '3.12.6' ... was not found for
          # Ubuntu 26.04"), and a patch pin buys nothing here: the code targets
          # >=3.10 and has no patch-level dependency. render.yaml keeps its own
          # exact PYTHON_VERSION for the deployed service.
          python-version: "3.12"
          cache: pip

      # One command per step, each with its own limit. The step list is all that
      # is left of a run once its log has expired or cannot be fetched, so it has
      # to say which command failed; and a download that hangs must fail in
      # minutes with its last lines attached, not sit until the job limit.
      - name: Runner image
        run: |
          . /etc/os-release
          echo "::notice title=Runner image::$PRETTY_NAME (image ${ImageOS:-?} ${ImageVersion:-?}); $(pg_dump --version 2>&1 | head -1)"

      - name: Install Python packages
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          echo "::notice title=Playwright::$(python -m playwright --version)"

      # Chromium for the browser E2E (playwright is in requirements-dev). Its
      # system libraries come from apt, the browser itself from Playwright's CDN.
      - name: Install Chromium system libraries
        timeout-minutes: 8
        run: |
          set -o pipefail
          timeout 420 python -m playwright install-deps chromium 2>&1 | tee /tmp/step.log || {
            code=$?
            tail -n 9 /tmp/step.log | while IFS= read -r line; do echo "::error title=playwright install-deps (exit $code)::$line"; done
            exit 1
          }

      - name: Download Chromium
        timeout-minutes: 6
        run: |
          set -o pipefail
          timeout 300 python -m playwright install chromium 2>&1 | tee /tmp/step.log || {
            code=$?
            tail -n 9 /tmp/step.log | while IFS= read -r line; do echo "::error title=playwright install (exit $code)::$line"; done
            exit 1
          }

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q -p no:cacheprovider
