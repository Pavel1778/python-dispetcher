name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # The Rust core (rust/) is not in the request path, but it carries a parity
    # contract with the Python tables (tests/test_rust_parity.py) that must hold
    # on every change. Without a toolchain in CI that parity test skips, so this
    # job installs stable Rust, builds the workspace, runs its own tests, and
    # then runs the Python/Rust parity suite against the built binary.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oh_test
          POSTGRES_PASSWORD: oh_test_pw
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_SUPABASE_DB_URL: postgresql://oh_test:oh_test_pw@127.0.0.1:5432/orchestrator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify tested revision
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "::notice title=Tested commit::$EXPECTED"

      - name: Install Rust (stable)
        timeout-minutes: 6
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          echo "::notice title=Rust toolchain::$(rustc --version); $(cargo --version)"

      - name: Rust formatting
        timeout-minutes: 5
        working-directory: rust
        run: cargo fmt --all --check

      - name: Rust lints
        timeout-minutes: 10
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build the Rust workspace
        timeout-minutes: 10
        working-directory: rust
        run: |
          cargo build --workspace --release --locked
          cargo build -p nexus-domain --example state_edges --release --locked
          cargo build -p nexus-storage --example claim_probe --release --locked

      - name: Rust tests
        timeout-minutes: 10
        working-directory: rust
        run: cargo test --workspace --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages for the parity test
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Python/Rust parity
        timeout-minutes: 8
        env:
          NEXUS_RUST_BIN: ${{ github.workspace }}/rust/target/release/nexus-rs
          NEXUS_EDGE_PROBE: ${{ github.workspace }}/rust/target/release/examples/state_edges
          NEXUS_CLAIM_PROBE: ${{ github.workspace }}/rust/target/release/examples/claim_probe
        run: |
          set -o pipefail
          test -x "$NEXUS_RUST_BIN" && test -x "$NEXUS_CLAIM_PROBE"
          pytest tests/test_rust_state_effects.py tests/test_rust_parity.py tests/test_rust_claim.py -q -p no:cacheprovider -rfEs 2>&1 | tee /tmp/parity.log
          if grep -q '^SKIPPED ' /tmp/parity.log; then
            echo "::error title=parity::the SQLx gate must run every case on PostgreSQL"
            exit 1
          fi

      # Same PG service, one physical clone per trial; no cloud or UI load.
      # No speed threshold: variance or a slower candidate must be visible.
      - name: Measure successful storage grants
        timeout-minutes: 5
        env:
          NEXUS_EDGE_PROBE: ${{ github.workspace }}/rust/target/release/examples/state_edges
          NEXUS_CLAIM_PROBE: ${{ github.workspace }}/rust/target/release/examples/claim_probe
          COMPARISON_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python benchmarks/compare_claims.py --tasks 200 --rounds 4 --out /tmp/claim-comparison.json
          python -c 'import json; print("::notice title=claim-comparison::" + json.dumps(json.load(open("/tmp/claim-comparison.json")), separators=(",", ":")))'

      - name: Parity report
        if: always()
        run: |
          [ -f /tmp/parity.log ] || exit 0
          echo "::notice title=parity::$(tail -n 1 /tmp/parity.log)"
          grep -E '^(FAILED|ERROR) ' /tmp/parity.log | head -n 10 | cut -c1-300 \
            | while IFS= read -r line; do echo "::error title=parity::$line"; done

  test:
    # A named image, not `ubuntu-latest`. While that label migrates it resolves
    # to either 24.04 or 26.04, and the two are not interchangeable here: the
    # backup/restore drill dumps the PostgreSQL 17 service below with the
    # image's own client tools, and pg_dump refuses a server newer than itself.
    # 24.04 ships pg_dump 16 (the drill fails with "server version mismatch"),
    # 26.04 ships 18. Both were run side by side on 2026-11-11 to establish this.
    runs-on: ubuntu-26.04
    # The suite grew with the chat/command/conversation/run-history/project
    # increments; on a shared runner it reached ~29 minutes and was cancelled
    # by the old 30-minute limit at 96% with no failure. The job's own steps
    # each carry their own timeout; this is the outer bound for a slow runner.
    timeout-minutes: 50

    # The Cloud integration tests run against a real PostgreSQL server and skip
    # cleanly when it is absent, so the service is only here to keep them
    # running. No repository secret is needed: the DSN below is a throwaway
    # local credential. The tests apply migrations/ themselves.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oh_test
          POSTGRES_PASSWORD: oh_test_pw
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_SUPABASE_DB_URL: postgresql://oh_test:oh_test_pw@127.0.0.1:5432/orchestrator

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify tested revision
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "::notice title=Tested commit::$EXPECTED"

      - uses: actions/setup-python@v5
        with:
          # 3.12.x, not the exact patch. The runner image no longer ships
          # 3.12.6 (it reported "The version '3.12.6' ... was not found for
          # Ubuntu 26.04"), and a patch pin buys nothing here: the code targets
          # >=3.10 and has no patch-level dependency. render.yaml keeps its own
          # exact PYTHON_VERSION for the deployed service.
          python-version: "3.12"
          cache: pip

      # One command per step, each with its own limit, and the facts a reader
      # needs written as annotations. The step list and the annotations are
      # what the API still shows when a log has expired or cannot be fetched,
      # so they have to say which command failed, on which image, and how many
      # tests ran.
      - name: Runner image
        run: |
          . /etc/os-release
          echo "::notice title=Runner image::$PRETTY_NAME (image ${ImageOS:-?} ${ImageVersion:-?}); $(pg_dump --version 2>&1 | head -n 1)"

      - name: Install Python packages
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          echo "::notice title=Playwright::$(python -m playwright --version)"

      # Chromium for the browser E2E (playwright is in requirements-dev). Only
      # the browser is downloaded here. Its system libraries are *not* installed
      # up front: the runner image already has them, and `install --with-deps`
      # goes through apt first, which made every run depend on the package
      # mirrors (on 2026-11-11 that part hung for 7-10 minutes and failed three
      # attempts on main, then ran into its limit on both images, while the
      # Python packages installed in seconds).
      - name: Download Chromium
        timeout-minutes: 6
        run: |
          if ! timeout 240 python -m playwright install chromium > /tmp/step.log 2>&1; then
            tail -n 6 /tmp/step.log | while IFS= read -r line; do echo "::warning title=playwright install chromium::$line"; done
            chrome="$(command -v google-chrome || command -v chromium || true)"
            if [ -z "$chrome" ]; then
              echo "::error title=Chromium::the download failed and the image has no browser of its own"
              exit 1
            fi
            echo "::warning title=Chromium::download failed; using the image's own $chrome"
            echo "E2E_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          fi

      - name: Start Chromium once
        id: probe
        continue-on-error: true
        timeout-minutes: 3
        run: python tools/ci_browser_probe.py

      - name: Install Chromium system libraries (only when it did not start)
        if: steps.probe.outcome == 'failure'
        timeout-minutes: 10
        run: |
          if ! timeout 420 python -m playwright install-deps chromium > /tmp/step.log 2>&1; then
            tail -n 8 /tmp/step.log | while IFS= read -r line; do echo "::error title=playwright install-deps::$line"; done
            exit 1
          fi
          python tools/ci_browser_probe.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -rfEs 2>&1 | tee /tmp/pytest.log

      - name: Test report
        if: always()
        run: |
          [ -f /tmp/pytest.log ] || exit 0
          echo "::notice title=pytest::$(tail -n 1 /tmp/pytest.log)"
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -n 10 | cut -c1-300 \
            | while IFS= read -r line; do echo "::error title=test::$line"; done
          grep -E '^SKIPPED ' /tmp/pytest.log | sed -E 's/^SKIPPED \[[0-9]+\] [^ ]+: //' | sort | uniq -c \
            | head -n 8 | cut -c1-300 | while IFS= read -r line; do echo "::notice title=skipped::$line"; done

  selfqa-container:
    # Exercise the real local Docker daemon; unit tests alone cannot prove that
    # network/filesystem flags are enforced. The image ID passed to the runner
    # is immutable; it is a CI fixture, not a production-approved QA image.
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==9.0.3
      - name: Pull Python fixture and record its image ID
        run: |
          docker pull python:3.12-slim
          echo "NEXUS_TEST_DOCKER_IMAGE=$(docker image inspect --format '{{.Id}}' python:3.12-slim)" >> "$GITHUB_ENV"
      - name: Exercise the real container runner
        run: |
          python -c 'import os; assert os.name == "posix" and os.getuid() != 0; assert os.environ.get("NEXUS_TEST_DOCKER_IMAGE")'
          python -m pytest tests/test_selfqa_sandbox.py -q -p no:cacheprovider
