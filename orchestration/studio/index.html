<body>

  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

<div class="app" id="app" data-view="home">

  <aside class="sidebar" id="sidebar" aria-label="Проекты и чаты">
    <div class="sb-head">
      <a class="brand" href="#/" aria-label="NEXUS — на главную">
        <svg class="brand-mark" aria-hidden="true"><use href="#i-logo"/></svg>
        <span class="brand-name">NEXUS</span>
      </a>
      <button class="icon-btn" type="button" data-action="toggle-sidebar"
              aria-label="Скрыть панель чатов" title="Скрыть панель">
        <svg class="icon"><use href="#i-sidebar"/></svg>
      </button>
    </div>

    <button class="sb-project" type="button" id="project-switch" data-action="project-menu"
            aria-haspopup="menu" aria-expanded="false" title="Сменить проект">
      <span class="sb-project-icon" aria-hidden="true"><svg class="icon"><use href="#i-layers"/></svg></span>
      <span class="sb-project-text">
        <span class="sb-project-name" id="project-name">Проект</span>
        <span class="sb-project-repo" id="project-repo">Репозиторий не подключён</span>
      </span>
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </button>

    <button class="btn btn-new" type="button" id="new-chat" data-action="new-chat">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
      <span>Новый чат</span>
    </button>

    <label class="sb-search">
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="chat-search" type="search" placeholder="Поиск по чатам" autocomplete="off"
             aria-label="Поиск по чатам">
    </label>

    <nav class="sb-list" id="chat-list" aria-label="История чатов"></nav>

    <div class="sb-foot">
      <button class="sb-user" type="button" id="user-menu" data-action="user-menu"
              aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="user-avatar" aria-hidden="true"></span>
        <span class="sb-user-name" id="whoami"></span>
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-more"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" data-action="close-overlays" hidden></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" type="button" id="open-sidebar" data-action="toggle-sidebar"
              aria-label="Показать панель чатов" title="Чаты">
        <svg class="icon"><use href="#i-sidebar"/></svg>
      </button>
      <button class="title-btn" type="button" id="conv-title" data-action="rename-chat" hidden></button>
      <div class="topbar-spacer"></div>
      <button class="chip" type="button" id="repo-chip" data-action="open-repo" title="Репозиторий и ветка">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-branch"/></svg>
        <span id="repo-chip-text">Подключить репозиторий</span>
      </button>
      <button class="icon-btn" type="button" id="ws-toggle" data-action="toggle-workspace"
              aria-label="Рабочая область: файлы и агент" aria-pressed="false" title="Рабочая область">
        <svg class="icon"><use href="#i-panel"/></svg>
        <span class="badge-dot" id="ws-dot" hidden></span>
      </button>
    </header>

    <section class="thread" id="thread" aria-label="Диалог"></section>

    <div class="composer-wrap" id="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="prompt" rows="1" aria-label="Сообщение"
                  placeholder="Спросите о коде или опишите задачу"></textarea>
        <div class="composer-bar">
          <button class="chip chip-mode" type="button" id="mode-btn" data-action="mode-menu"
                  aria-haspopup="menu" aria-expanded="false" title="Режим работы">
            <svg class="icon icon-sm" aria-hidden="true"><use id="mode-icon" href="#i-message"/></svg>
            <span id="mode-label">Вопрос</span>
            <svg class="icon icon-xs" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <span class="composer-hint" id="composer-hint"></span>
          <button class="send" type="submit" id="send" aria-label="Отправить" title="Отправить (Enter)" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg>
          </button>
        </div>
      </form>
      <p class="composer-note" id="composer-note" role="status"></p>
    </div>

    <section class="home-extras" id="home-extras" aria-label="С чего начать"></section>
  </main>

  <aside class="workspace" id="workspace" aria-label="Рабочая область" hidden>
    <div class="ws-resizer" id="ws-resizer" role="separator" aria-orientation="vertical"
         aria-label="Ширина рабочей области" tabindex="0"></div>
    <header class="ws-head">
      <div class="tabs" role="tablist" aria-label="Разделы рабочей области">
        <button class="tab" type="button" role="tab" id="tab-files" data-action="ws-tab" data-tab="files"
                aria-selected="true" aria-controls="ws-body">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-folder"/></svg><span>Файлы</span>
        </button>
        <button class="tab" type="button" role="tab" id="tab-agent" data-action="ws-tab" data-tab="agent"
                aria-selected="false" aria-controls="ws-body">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-bot"/></svg><span>Агент</span>
          <span class="tab-count" id="agent-count" hidden></span>
        </button>
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" type="button" data-action="toggle-workspace" aria-label="Закрыть рабочую область" title="Закрыть">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </header>
    <div class="ws-body" id="ws-body" role="tabpanel"></div>
  </aside>
</div>

<div class="layer" id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<noscript><div class="noscript">Для работы NEXUS нужен JavaScript.</div></noscript>
</body>
</html>
